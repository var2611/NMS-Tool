name: Build Windows

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/build-windows.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: [self-hosted, windows]
    name: Build Windows (x86_64 Native)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Locate and Setup Python
        shell: cmd
        run: |
          set "PYTHON_EXE="
          
          :: 1. Check if 'where python' yields a real Python (ignoring Microsoft Store dummy)
          where python >nul 2>&1
          if %errorlevel% equ 0 (
              for /f "delims=" %%i in ('where python') do (
                  echo %%i | findstr /i "WindowsApps" >nul
                  if errorlevel 1 (
                      set "PYTHON_EXE=%%i"
                      goto :found
                  )
              )
          )
          
          :: 2. Check if 'where py' yields a Python Launcher
          where py >nul 2>&1
          if %errorlevel% equ 0 (
              for /f "delims=" %%i in ('where py') do (
                  set "PYTHON_EXE=%%i"
                  goto :found
              )
          )

          :: 3. Check registry for User Installation
          for /f "tokens=2*" %%a in ('reg query "HKCU\Software\Python\PythonCore" /s /v InstallPath 2^>nul ^| findstr REG_SZ') do (
              if exist "%%b\python.exe" (
                  set "PYTHON_EXE=%%b\python.exe"
                  goto :found
              )
          )

          :: 4. Check registry for System Installation
          for /f "tokens=2*" %%a in ('reg query "HKLM\Software\Python\PythonCore" /s /v InstallPath 2^>nul ^| findstr REG_SZ') do (
              if exist "%%b\python.exe" (
                  set "PYTHON_EXE=%%b\python.exe"
                  goto :found
              )
          )

          :: 5. Check common paths (Chocolatey, Scoop, and standard paths)
          if exist "C:\tools\python\python.exe" (
              set "PYTHON_EXE=C:\tools\python\python.exe"
              goto :found
          )
          if exist "C:\tools\python3\python.exe" (
              set "PYTHON_EXE=C:\tools\python3\python.exe"
              goto :found
          )
          if exist "%USERPROFILE%\scoop\apps\python\current\python.exe" (
              set "PYTHON_EXE=%USERPROFILE%\scoop\apps\python\current\python.exe"
              goto :found
          )
          
          for %%v in (313 312 311 310 39 38 37) do (
              if exist "C:\Python%%v\python.exe" (
                  set "PYTHON_EXE=C:\Python%%v\python.exe"
                  goto :found
              )
              if exist "C:\Program Files\Python%%v\python.exe" (
                  set "PYTHON_EXE=C:\Program Files\Python%%v\python.exe"
                  goto :found
              )
              if exist "C:\Program Files (x86)\Python%%v\python.exe" (
                  set "PYTHON_EXE=C:\Program Files (x86)\Python%%v\python.exe"
                  goto :found
              )
              if exist "%USERPROFILE%\AppData\Local\Programs\Python\Python%%v\python.exe" (
                  set "PYTHON_EXE=%USERPROFILE%\AppData\Local\Programs\Python\Python%%v\python.exe"
                  goto :found
              )
              if exist "%USERPROFILE%\AppData\Local\Programs\Python\Python%%v-64\python.exe" (
                  set "PYTHON_EXE=%USERPROFILE%\AppData\Local\Programs\Python\Python%%v-64\python.exe"
                  goto :found
              )
              if exist "%LocalAppData%\Programs\Python\Python%%v\python.exe" (
                  set "PYTHON_EXE=%LocalAppData%\Programs\Python\Python%%v\python.exe"
                  goto :found
              )
              if exist "%LocalAppData%\Programs\Python\Python%%v-64\python.exe" (
                  set "PYTHON_EXE=%LocalAppData%\Programs\Python\Python%%v-64\python.exe"
                  goto :found
              )
          )

          echo Python not found on the system!
          exit /b 1

          :found
          echo Found Python executable at: %PYTHON_EXE%
          for %%i in ("%PYTHON_EXE%") do set "PYTHON_DIR=%%~dpi"
          if "%PYTHON_DIR:~-1%"=="\" set "PYTHON_DIR=%PYTHON_DIR:~0,-1%"
          
          echo %PYTHON_DIR%>> %GITHUB_PATH%
          echo %PYTHON_DIR%\Scripts>> %GITHUB_PATH%
          echo Added to PATH: %PYTHON_DIR%

      - name: Install Python dependencies & PyInstaller
        shell: cmd
        run: |
          python -m venv venv
          call venv\Scripts\activate.bat
          pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller

      - name: Build standalone Python backend (PyInstaller)
        shell: cmd
        working-directory: app
        run: |
          call ..\venv\Scripts\activate.bat
          pyinstaller nms-backend.spec --distpath dist-backend --workpath build-pyinstaller --noconfirm

      - name: Rename & place sidecar binary
        shell: cmd
        run: |
          if not exist "app\src-tauri\binaries" mkdir "app\src-tauri\binaries"
          copy /y "app\dist-backend\nms-backend.exe" "app\src-tauri\binaries\nms-backend-x86_64-pc-windows-msvc.exe"

      - name: Build frontend
        shell: cmd
        working-directory: app/frontend
        run: |
          npm install
          npm run build

      - name: Install Tauri CLI & dependencies
        shell: cmd
        working-directory: app
        run: |
          npm install

      - name: Build Tauri Desktop App
        shell: cmd
        working-directory: app
        run: |
          npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: sentinelnms-windows-build
          path: |
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
