name: Build Windows

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/build-windows.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: [self-hosted, windows]
    name: Build Windows (x86_64 Native)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Locate and Setup Python
        shell: cmd
        run: |
          set "PYTHON_PATH="
          if exist "C:\Python311\python.exe" set "PYTHON_PATH=C:\Python311"
          if exist "C:\Python312\python.exe" set "PYTHON_PATH=C:\Python312"
          if exist "C:\Python310\python.exe" set "PYTHON_PATH=C:\Python310"
          if exist "C:\Program Files\Python311\python.exe" set "PYTHON_PATH=C:\Program Files\Python311"
          if exist "C:\Program Files\Python312\python.exe" set "PYTHON_PATH=C:\Program Files\Python312"
          if exist "%USERPROFILE%\AppData\Local\Programs\Python\Python311\python.exe" set "PYTHON_PATH=%USERPROFILE%\AppData\Local\Programs\Python\Python311"
          if exist "%USERPROFILE%\AppData\Local\Programs\Python\Python312\python.exe" set "PYTHON_PATH=%USERPROFILE%\AppData\Local\Programs\Python\Python312"
          if exist "%USERPROFILE%\AppData\Local\Programs\Python\Python310\python.exe" set "PYTHON_PATH=%USERPROFILE%\AppData\Local\Programs\Python\Python310"
          if exist "%LocalAppData%\Programs\Python\Python311\python.exe" set "PYTHON_PATH=%LocalAppData%\Programs\Python\Python311"
          if exist "%LocalAppData%\Programs\Python\Python312\python.exe" set "PYTHON_PATH=%LocalAppData%\Programs\Python\Python312"
          if exist "%LocalAppData%\Programs\Python\Python310\python.exe" set "PYTHON_PATH=%LocalAppData%\Programs\Python\Python310"
          if not "%PYTHON_PATH%"=="" (
              echo Found Python in %PYTHON_PATH%
              echo %PYTHON_PATH%>> %GITHUB_PATH%
              echo %PYTHON_PATH%\Scripts>> %GITHUB_PATH%
          ) else (
              echo Python not found in standard paths. If it is already in your system PATH, GHA will use it.
          )

      - name: Install Python dependencies & PyInstaller
        shell: cmd
        run: |
          python -m venv venv
          call venv\Scripts\activate.bat
          pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller

      - name: Build standalone Python backend (PyInstaller)
        shell: cmd
        working-directory: app
        run: |
          call ..\venv\Scripts\activate.bat
          pyinstaller nms-backend.spec --distpath dist-backend --workpath build-pyinstaller --noconfirm

      - name: Rename & place sidecar binary
        shell: cmd
        run: |
          if not exist "app\src-tauri\binaries" mkdir "app\src-tauri\binaries"
          copy /y "app\dist-backend\nms-backend.exe" "app\src-tauri\binaries\nms-backend-x86_64-pc-windows-msvc.exe"

      - name: Build frontend
        shell: cmd
        working-directory: app/frontend
        run: |
          npm install
          npm run build

      - name: Install Tauri CLI & dependencies
        shell: cmd
        working-directory: app
        run: |
          npm install

      - name: Build Tauri Desktop App
        shell: cmd
        working-directory: app
        run: |
          npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: sentinelnms-windows-build
          path: |
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
