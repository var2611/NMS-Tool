name: Build Windows

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/build-windows.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: [self-hosted, windows]
    name: Build Windows (x86_64 Native)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Locate and Setup Python
        shell: powershell
        run: |
          $pythonExe = $null

          # 1. Check if python is in PATH (and is not Microsoft Store dummy)
          $pythonCmd = Get-Command python -ErrorAction SilentlyContinue
          if ($pythonCmd) {
              $p = $pythonCmd.Source
              if ($p -notlike "*WindowsApps*") {
                  $pythonExe = $p
                  Write-Host "Found in PATH: $pythonExe"
              }
          }

          # 2. Check User profile folders using wildcards (handles service account context)
          if (-not $pythonExe) {
              $searchPatterns = @(
                  "C:\Users\*\AppData\Local\Programs\Python\Python*\python.exe",
                  "C:\Users\*\AppData\Local\Python\bin\python.exe",
                  "C:\Users\*\AppData\Local\Programs\Python\Python*-64\python.exe"
              )
              foreach ($pattern in $searchPatterns) {
                  $foundFiles = Get-Item -Path $pattern -ErrorAction SilentlyContinue
                  if ($foundFiles) {
                      $pythonExe = $foundFiles[0].FullName
                      Write-Host "Found in User Profiles: $pythonExe"
                      break
                  }
              }
          }

          # 3. Check if 'py' launcher is available
          if (-not $pythonExe) {
              $pyCmd = Get-Command py -ErrorAction SilentlyContinue
              if ($pyCmd) {
                  $pythonExe = $pyCmd.Source
                  Write-Host "Found via py launcher: $pythonExe"
              }
          }

          # 4. Check registry (HKCU and HKLM)
          if (-not $pythonExe) {
              $regPaths = @(
                  "HKCU:\Software\Python\PythonCore",
                  "HKLM:\Software\Python\PythonCore"
              )
              foreach ($regPath in $regPaths) {
                  if (Test-Path $regPath) {
                      Get-ChildItem -Path $regPath | ForEach-Object {
                          $installPathKey = Join-Path $_.PSPath "InstallPath"
                          if (Test-Path $installPathKey) {
                              $val = (Get-ItemProperty -Path $installPathKey)."(default)"
                              if ($val -and (Test-Path (Join-Path $val "python.exe"))) {
                                  $pythonExe = Join-Path $val "python.exe"
                                  Write-Host "Found in Registry: $pythonExe"
                                  return
                              }
                          }
                      }
                  }
                  if ($pythonExe) { break }
              }
          }

          # 5. Check common folders (Chocolatey, Scoop)
          if (-not $pythonExe) {
              $commonDirs = @(
                  "C:\tools\python\python.exe",
                  "C:\tools\python3\python.exe",
                  "$env:USERPROFILE\scoop\apps\python\current\python.exe"
              )
              foreach ($p in $commonDirs) {
                  if (Test-Path $p) {
                      $pythonExe = $p
                      Write-Host "Found in common folder: $pythonExe"
                      break
                  }
              }
          }

          # 6. Check standard install paths (versions 3.7 to 3.15)
          if (-not $pythonExe) {
              $versions = @("315", "314", "313", "312", "311", "310", "39", "38", "37")
              $searchRoots = @(
                  "C:\",
                  "C:\Program Files\",
                  "C:\Program Files (x86)\",
                  "$env:USERPROFILE\AppData\Local\Programs\Python\",
                  "$env:LocalAppData\Programs\Python\"
              )
              foreach ($v in $versions) {
                  foreach ($root in $searchRoots) {
                      $candidates = @(
                          (Join-Path $root "Python$v\python.exe"),
                          (Join-Path $root "Python$v-64\python.exe")
                      )
                      foreach ($c in $candidates) {
                          if (Test-Path $c) {
                              $pythonExe = $c
                              Write-Host "Found in standard path: $pythonExe"
                              break
                          }
                      }
                      if ($pythonExe) { break }
                  }
                  if ($pythonExe) { break }
              }
          }

          # 7. Diagnostics: Search C: drive 3 levels deep if still not found
          if (-not $pythonExe) {
              Write-Host "Python not found in standard paths. Searching C:\ drive (3 levels deep)..."
              $searched = Get-ChildItem -Path "C:\*" -Filter "python.exe" -Recurse -Depth 2 -File -ErrorAction SilentlyContinue
              if ($searched) {
                  foreach ($f in $searched) {
                      Write-Host "Found custom installation: $($f.FullName)"
                      $pythonExe = $f.FullName
                      break
                  }
              }
          }

          if ($pythonExe) {
              Write-Host "Using Python executable: $pythonExe"
              $pythonDir = Split-Path -Path $pythonExe -Parent
              
              # Add to GHA PATH
              $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              "$pythonDir\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Added to GHA PATH: $pythonDir"
          } else {
              Write-Error "Python not found on the system!"
              exit 1
          }

      - name: Install Python dependencies & PyInstaller
        shell: powershell
        run: |
          python -m venv venv
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\pip.exe install -r app/requirements.txt pyinstaller

      - name: Build standalone Python backend (PyInstaller)
        shell: powershell
        working-directory: app
        run: |
          ..\venv\Scripts\pyinstaller.exe nms-backend.spec --distpath dist-backend --workpath build-pyinstaller --noconfirm

      - name: Rename & place sidecar binary
        shell: powershell
        run: |
          if (-not (Test-Path app/src-tauri/binaries)) {
              New-Item -ItemType Directory -Force -Path app/src-tauri/binaries
          }
          Copy-Item app/dist-backend/nms-backend.exe app/src-tauri/binaries/nms-backend-x86_64-pc-windows-msvc.exe -Force

      - name: Build frontend
        shell: powershell
        working-directory: app/frontend
        run: |
          npm install
          npm run build

      - name: Install Tauri CLI & dependencies
        shell: powershell
        working-directory: app
        run: |
          npm install

      - name: Build Tauri Desktop App
        shell: powershell
        working-directory: app
        run: |
          npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: sentinelnms-windows-build
          path: |
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
