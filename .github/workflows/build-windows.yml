name: Build Windows

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/build-windows.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: [self-hosted, windows]
    name: Build Windows (x86_64 Native)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Locate and Setup Python
        shell: powershell
        run: |
          $pythonDir = "C:\zzz\python"
          if (Test-Path (Join-Path $pythonDir "python.exe")) {
              Write-Host "Using static Python installation at: $pythonDir"
              $pythonDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              "$pythonDir\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          } else {
              Write-Error "Python not found at static path: $pythonDir"
              exit 1
          }

      - name: Locate and Setup Rust (Cargo)
        shell: powershell
        run: |
          $cargoExe = $null

          # 1. Check if cargo is in PATH
          $cargoCmd = Get-Command cargo -ErrorAction SilentlyContinue
          if ($cargoCmd) {
              $cargoExe = $cargoCmd.Source
              Write-Host "Found Cargo in PATH: $cargoExe"
          }

          # 2. Check User profile folders using loop
          if (-not $cargoExe) {
              $usersDir = "C:\Users"
              if (Test-Path $usersDir) {
                  $subDirs = Get-ChildItem -Path $usersDir -Directory -ErrorAction SilentlyContinue
                  foreach ($uDir in $subDirs) {
                      $cPath = Join-Path $uDir.FullName ".cargo\bin\cargo.exe"
                      if (Test-Path $cPath -ErrorAction SilentlyContinue) {
                          $cargoExe = $cPath
                          Write-Host "Found Cargo in User Profile ($($uDir.Name)): $cargoExe"
                          break
                      }
                  }
              }
          }

          # 3. Check common system paths
          if (-not $cargoExe) {
              $commonPaths = @(
                  "C:\Program Files\Rust\bin\cargo.exe",
                  "C:\Program Files (x86)\Rust\bin\cargo.exe",
                  "C:\rust\bin\cargo.exe"
              )
              foreach ($p in $commonPaths) {
                  if (Test-Path $p) {
                      $cargoExe = $p
                      Write-Host "Found Cargo in common path: $cargoExe"
                      break
                  }
              }
          }

          if ($cargoExe) {
              $cargoDir = Split-Path -Path $cargoExe -Parent
              $cargoDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              Write-Host "Added Cargo to GHA PATH: $cargoDir"
          } else {
              Write-Error "Rust/Cargo not found on the system! Please ensure Rust is installed."
              exit 1
          }

      - name: Install Python dependencies & PyInstaller
        shell: powershell
        run: |
          python -m venv venv
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\pip.exe install -r app/requirements.txt pyinstaller

      - name: Build standalone Python backend (PyInstaller)
        shell: powershell
        working-directory: app
        run: |
          ..\venv\Scripts\pyinstaller.exe nms-backend.spec --distpath dist-backend --workpath build-pyinstaller --noconfirm

      - name: Rename & place sidecar binary
        shell: powershell
        run: |
          if (-not (Test-Path app/src-tauri/binaries)) {
              New-Item -ItemType Directory -Force -Path app/src-tauri/binaries
          }
          Copy-Item app/dist-backend/nms-backend.exe app/src-tauri/binaries/nms-backend-x86_64-pc-windows-msvc.exe -Force

      - name: Build frontend
        shell: powershell
        working-directory: app/frontend
        run: |
          npm install
          npm run build

      - name: Install Tauri CLI & dependencies
        shell: powershell
        working-directory: app
        run: |
          npm install

      - name: Build Tauri Desktop App
        shell: powershell
        working-directory: app
        run: |
          npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: sentinelnms-windows-build
          path: |
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
