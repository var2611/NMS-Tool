name: Build Windows

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/build-windows.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows (x86_64 Native)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable


      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Python dependencies & PyInstaller
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          python -m venv venv
          .\venv\Scripts\python.exe -m pip install --upgrade pip
          .\venv\Scripts\pip.exe install -r app/requirements.txt pyinstaller

      - name: Build standalone Python backend (PyInstaller)
        shell: powershell
        working-directory: app
        run: |
          $ErrorActionPreference = 'Continue'
          ..\venv\Scripts\pyinstaller.exe nms-backend.spec --distpath dist-backend --workpath build-pyinstaller --noconfirm

      - name: Rename & place sidecar binary
        shell: powershell
        run: |
          if (-not (Test-Path app/src-tauri/binaries)) {
              New-Item -ItemType Directory -Force -Path app/src-tauri/binaries
          }
          Copy-Item app/dist-backend/nms-backend.exe app/src-tauri/binaries/nms-backend-x86_64-pc-windows-msvc.exe -Force

      - name: Build frontend
        shell: powershell
        working-directory: app/frontend
        run: |
          $ErrorActionPreference = 'Continue'
          npm install
          npm run build

      - name: Install Tauri CLI & dependencies
        shell: powershell
        working-directory: app
        run: |
          $ErrorActionPreference = 'Continue'
          npm install

      - name: Build Tauri Desktop App
        shell: powershell
        working-directory: app
        run: |
          $ErrorActionPreference = 'Continue'
          npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: sentinelnms-windows-build
          path: |
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
