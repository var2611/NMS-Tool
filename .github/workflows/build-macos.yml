name: Build macOS

on:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/build-macos.yml'
      - 'app/**'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-macos:
    runs-on: macos-latest
    name: Build macOS (ARM64 Native)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies & PyInstaller
        run: |
          python3 -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r app/requirements.txt pyinstaller

      - name: Build standalone Python backend (PyInstaller)
        working-directory: app
        run: |
          ../venv/bin/pyinstaller nms-backend.spec --distpath dist-backend --workpath build-pyinstaller --noconfirm

      - name: Rename & place sidecar binary
        run: |
          mkdir -p app/src-tauri/binaries
          cp app/dist-backend/nms-backend app/src-tauri/binaries/nms-backend-aarch64-apple-darwin

      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm install
          npm run build

      - name: Install Tauri CLI & dependencies
        working-directory: app
        run: |
          npm install

      - name: Build Tauri Desktop App
        working-directory: app
        run: |
          npx tauri build --target aarch64-apple-darwin

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sentinelnms-macos-dmg
          path: |
            app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app
            app/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: warn
