name: Build Desktop Apps (Self-Hosted)

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-linux:
    runs-on: [self-hosted, linux]
    name: Build Linux (ARM64 Native)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Python dependencies & PyInstaller
        run: |
          python3 -m venv venv
          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r app/requirements.txt pyinstaller

      - name: Build standalone Python backend (PyInstaller)
        working-directory: app
        run: |
          ../venv/bin/pyinstaller nms-backend.spec --distpath dist-backend --workpath build-pyinstaller --noconfirm

      - name: Rename & place sidecar binary
        run: |
          mkdir -p app/src-tauri/binaries
          cp app/dist-backend/nms-backend app/src-tauri/binaries/nms-backend-aarch64-unknown-linux-gnu

      - name: Build frontend
        working-directory: app/frontend
        run: |
          npm install
          npm run build

      - name: Install Tauri CLI & dependencies
        working-directory: app
        run: |
          npm install

      - name: Build Tauri Desktop App
        working-directory: app
        run: |
          npx tauri build --target aarch64-unknown-linux-gnu

      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinelnms-linux-deb
          path: |
            app/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn

  build-windows:
    runs-on: [self-hosted, windows]
    name: Build Windows (x86_64 Native)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies & PyInstaller
        shell: cmd
        run: |
          python -m venv venv
          call venv\Scripts\activate.bat
          pip install --upgrade pip
          pip install -r app/requirements.txt pyinstaller

      - name: Build standalone Python backend (PyInstaller)
        shell: cmd
        working-directory: app
        run: |
          call ..\venv\Scripts\activate.bat
          pyinstaller nms-backend.spec --distpath dist-backend --workpath build-pyinstaller --noconfirm

      - name: Rename & place sidecar binary
        shell: cmd
        run: |
          if not exist "app\src-tauri\binaries" mkdir "app\src-tauri\binaries"
          copy /y "app\dist-backend\nms-backend.exe" "app\src-tauri\binaries\nms-backend-x86_64-pc-windows-msvc.exe"

      - name: Build frontend
        shell: cmd
        working-directory: app/frontend
        run: |
          npm install
          npm run build

      - name: Install Tauri CLI & dependencies
        shell: cmd
        working-directory: app
        run: |
          npm install

      - name: Build Tauri Desktop App
        shell: cmd
        working-directory: app
        run: |
          npx tauri build --target x86_64-pc-windows-msvc

      - name: Upload Windows Executables
        uses: actions/upload-artifact@v4
        with:
          name: sentinelnms-windows-build
          path: |
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            app/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn
