name: Build Tauri App

on:
  push:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build Windows (x64)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 18
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: x86_64-pc-windows-msvc

      - name: Build React frontend
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies & PyInstaller
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app/requirements.txt pyinstaller

      - name: Build standalone Python backend (PyInstaller)
        shell: bash
        working-directory: app
        run: |
          python -m PyInstaller nms-backend.spec --distpath dist-backend --workpath build-pyinstaller --noconfirm

      - name: Rename & place sidecar binary
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries
          cp app/dist-backend/nms-backend.exe app/src-tauri/binaries/nms-backend-x86_64-pc-windows-msvc.exe

      - name: Install Tauri CLI & dependencies
        working-directory: app
        run: |
          npm install

      - name: Build Tauri Desktop App
        working-directory: app
        run: |
          npx tauri build

      - name: Upload Windows MSI Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinelnms-windows-msi
          path: app/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinelnms-windows-exe
          path: app/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn

  build-mac:
    runs-on: macos-14
    name: Build macOS (Apple Silicon)
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js 18
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: aarch64-apple-darwin

      - name: Build React frontend
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies & PyInstaller
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r app/requirements.txt pyinstaller

      - name: Build standalone Python backend (PyInstaller)
        working-directory: app
        run: |
          python3 -m PyInstaller nms-backend.spec --distpath dist-backend --workpath build-pyinstaller --noconfirm

      - name: Rename & place sidecar binary
        run: |
          mkdir -p app/src-tauri/binaries
          cp app/dist-backend/nms-backend app/src-tauri/binaries/nms-backend-aarch64-apple-darwin

      - name: Install Tauri CLI & dependencies
        working-directory: app
        run: |
          npm install

      - name: Build Tauri Desktop App
        working-directory: app
        run: |
          npx tauri build --target aarch64-apple-darwin
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinelnms-mac-dmg
          path: |
            app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn

  build-linux:
    runs-on: ubuntu-22.04
    name: Build Linux (ARM64)
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build inside ARM64 Ubuntu container (QEMU)
        uses: uraimo/run-on-arch-action@v2
        with:
          arch: aarch64
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          env: |
            CI: true
          install: |
            apt-get update -y
            apt-get install -y curl build-essential python3 python3-pip python3-venv git \
              libsoup-3.0-dev libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
            # Install Node.js
            curl -fsSL https://deb.nodesource.com/setup_18.x | bash -
            apt-get install -y nodejs
            # Install Rust
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          run: |
            source $HOME/.cargo/env
            
            # Build React frontend
            cd app/frontend
            npm install
            npm run build
            cd ../..
            
            # Install Python dependencies & PyInstaller
            python3 -m pip install --upgrade pip
            python3 -m pip install -r app/requirements.txt pyinstaller
            
            # Build Python Sidecar
            cd app
            python3 -m PyInstaller nms-backend.spec --distpath dist-backend --workpath build-pyinstaller --noconfirm
            cd ..
            
            # Setup binaries folder
            mkdir -p app/src-tauri/binaries
            cp app/dist-backend/nms-backend app/src-tauri/binaries/nms-backend-aarch64-unknown-linux-gnu
            
            # Build Tauri App
            cd app
            npm install
            npx tauri build --target aarch64-unknown-linux-gnu
            cd ..

      - name: Upload Linux DEB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sentinelnms-linux-deb
          path: |
            app/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: warn
