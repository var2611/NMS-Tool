name: Build Desktop App

# Triggers:
#   - Every push to master  → updates the rolling "Latest Build" pre-release
#   - Push a tag v*.*.*     → creates a proper versioned release
#   - Manual run            → same as master push (use workflow_dispatch)
on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create/update releases and push the 'latest' tag

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # suppress Node 20 deprecation warnings

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # BUILD  — two parallel jobs, both on macos-14 (arm64 runner)
  #
  # Why both on macos-14 instead of macos-13 for x64?
  #   macos-13 (Intel) runners have very long queue times on GitHub Actions.
  #   macos-14 is fast and can build x64 via Rosetta 2: we simply create the
  #   Python venv under `arch -x86_64` so the bundled binaries are x86_64.
  #   electron-builder handles cross-downloading the correct Electron binary.
  #
  # Each job:
  #   1. Creates a Python venv matching the target arch (arm64 or x86_64)
  #   2. Builds the React frontend
  #   3. Runs electron-builder to produce a .dmg for that arch
  #   4. Uploads the .dmg as a workflow artifact for the release job
  # ──────────────────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false   # don't cancel the sibling job if one fails
      matrix:
        include:
          # Apple Silicon — M1 / M2 / M3 Macs
          - platform: mac-arm64
            python_arch: arm64
            build_cmd: npx electron-builder --mac --arm64 --publish never

          # Intel — older Macs (venv built via Rosetta on the arm64 runner)
          - platform: mac-x64
            python_arch: x86_64
            build_cmd: npx electron-builder --mac --x64 --publish never

    runs-on: macos-14     # single fast runner for both arches
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # setup-python on macos-14 installs a universal2 Python,
      # so both `python3` (arm64) and `arch -x86_64 python3` (x64) work.
      - name: Set up Python 3.11 (universal2)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # For arm64: plain python3 → native arm64 venv
      # For x64:   arch -x86_64 python3 → x86_64 venv via Rosetta
      # The venv is bundled inside the .dmg via extraResources, so the
      # Python binaries inside it must match the target architecture.
      - name: Create Python venv (${{ matrix.python_arch }})
        run: |
          if [[ "${{ matrix.python_arch }}" == "x86_64" ]]; then
            arch -x86_64 $(which python3) -m venv venv
          else
            python3 -m venv venv
          fi
          source venv/bin/activate
          pip install --upgrade pip -q
          pip install -r requirements.txt -q

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Electron / electron-builder
        run: npm install

      # CSC_IDENTITY_AUTO_DISCOVERY=false skips macOS code-signing in CI.
      # Users will see "unidentified developer" on first launch — right-click
      # → Open to bypass. Add CSC_LINK + CSC_KEY_PASSWORD repo secrets to
      # enable proper Apple Developer signing.
      - name: Build Electron installer
        run: ${{ matrix.build_cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List output files
        run: ls -lh dist-electron/

      # Pass the .dmg to the release job
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          path: dist-electron/*.dmg
          if-no-files-found: error
          retention-days: 1   # only needed until the release job picks it up

  # ──────────────────────────────────────────────────────────────────────────
  # RELEASE  — runs after BOTH builds succeed
  # Downloads both .dmg files and publishes them in one GitHub Release.
  # A single release job avoids race conditions from parallel uploads.
  # ──────────────────────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    name: Publish Release

    steps:
      - name: Checkout (needed to push the 'latest' git tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download macOS arm64 installer
        uses: actions/download-artifact@v4
        with:
          name: installer-mac-arm64
          path: release-files/

      - name: Download macOS x64 installer
        uses: actions/download-artifact@v4
        with:
          name: installer-mac-x64
          path: release-files/

      - name: List all release files
        run: ls -lh release-files/

      # Compute tag name, title, prerelease flag, and body for the release
      - name: Set release metadata
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME"                         >> $GITHUB_OUTPUT
            echo "name=SentinelNMS $GITHUB_REF_NAME"            >> $GITHUB_OUTPUT
            echo "prerelease=false"                             >> $GITHUB_OUTPUT
            echo "body=See commit history for full changelog."  >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
            COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)
            echo "tag=latest"                                                    >> $GITHUB_OUTPUT
            echo "name=Latest Build"                                             >> $GITHUB_OUTPUT
            echo "prerelease=true"                                               >> $GITHUB_OUTPUT
            echo "body=Auto-built from \`$SHORT_SHA\` — $COMMIT_MSG"            >> $GITHUB_OUTPUT
          fi

      # For master push: force-move the 'latest' tag to the current commit
      - name: Force-update 'latest' git tag
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -fa latest -m "Latest build ($GITHUB_SHA)"
          git push origin latest --force

      # Delete the stale 'latest' release before recreating it with fresh files
      - name: Delete existing 'latest' release
        if: github.ref == 'refs/heads/master'
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          PRERELEASE_FLAG=""
          [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]] && PRERELEASE_FLAG="--prerelease"

          NOTES_FLAG=""
          [[ "$GITHUB_REF" == refs/tags/v* ]] && NOTES_FLAG="--generate-notes"

          gh release create "${{ steps.meta.outputs.tag }}" \
            release-files/* \
            --title "${{ steps.meta.outputs.name }}" \
            --notes "${{ steps.meta.outputs.body }}" \
            $PRERELEASE_FLAG \
            $NOTES_FLAG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
