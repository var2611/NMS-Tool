name: Build Desktop App

# Triggers:
#   - Every push to master  → updates the rolling "Latest Build" pre-release
#   - Push a tag v*.*.*     → creates a proper versioned release
#   - Manual run            → same as master push (use workflow_dispatch)
on:
  push:
    branches: [master]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # required to create/update releases and push the 'latest' tag

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true   # suppress Node 20 deprecation warnings

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # BUILD  — three parallel jobs
  #
  # mac-arm64 : macos-14 runner → .dmg for Apple Silicon (M1/M2/M3)
  # linux     : ubuntu-22.04   → .deb + .AppImage for Linux x64
  # windows   : windows-latest → NSIS .exe for Windows x64
  #
  # Each job:
  #   1. Creates a native Python venv (binaries match the target OS/arch)
  #   2. Builds the React frontend
  #   3. Runs electron-builder to produce the installer
  #   4. Uploads the installer as a workflow artifact for the release job
  # ──────────────────────────────────────────────────────────────────────────
  build:
    strategy:
      fail-fast: false   # don't cancel sibling jobs if one fails
      matrix:
        include:
          # macOS Apple Silicon — M1 / M2 / M3 Macs
          - platform: mac-arm64
            os: macos-14
            build_cmd: npx electron-builder --mac --arm64 --publish never
            artifact_glob: dist-electron/*.dmg

          # Linux x64 — .deb (Debian/Ubuntu) + .AppImage (universal)
          - platform: linux
            os: ubuntu-22.04
            build_cmd: npx electron-builder --linux --x64 --publish never
            artifact_glob: "dist-electron/*.deb\n            dist-electron/*.AppImage"

          # Windows x64 — NSIS installer (.exe)
          - platform: windows
            os: windows-latest
            build_cmd: npx electron-builder --win --x64 --publish never
            artifact_glob: dist-electron/*.exe

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js 18
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # electron-builder needs these system libraries to produce deb / AppImage
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fakeroot rpm libarchive-tools \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 \
            libatspi2.0-0 libdrm2 libgbm1 libasound2

      # --copies is critical for macOS/Linux: without it, venv/bin/python is a
      # symlink to the CI runner's system Python (e.g. /usr/bin/python3.11).
      # electron-builder copies the symlink but NOT what it points to, so the
      # bundled app crashes with ENOENT on the user's machine.
      # --copies replaces symlinks with real binary copies, making the venv
      # fully self-contained and relocatable inside the .app / .deb / .AppImage.
      # Windows already uses real .exe files so --copies is safe there too.
      - name: Create Python venv (--copies for relocatable binaries)
        shell: bash
        run: |
          python3 -m venv --copies venv

          # Call the venv Python directly — no shell activation needed,
          # and avoids the Windows "pip can't replace itself" error.
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            VENV_PY="./venv/Scripts/python.exe"
          else
            VENV_PY="./venv/bin/python"
          fi

          "$VENV_PY" -m pip install --upgrade pip -q
          "$VENV_PY" -m pip install -r requirements.txt -q

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Electron / electron-builder
        run: npm install

      # CSC_IDENTITY_AUTO_DISCOVERY=false skips macOS code-signing in CI.
      # Users see "unidentified developer" on first launch — right-click → Open.
      # Add CSC_LINK + CSC_KEY_PASSWORD repo secrets to enable proper signing.
      - name: Build Electron installer
        run: ${{ matrix.build_cmd }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List output files
        shell: bash
        run: ls -lh dist-electron/

      # Upload installers for the release job to collect
      - name: Upload installer artifact (mac / windows)
        if: matrix.platform != 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.platform }}
          path: ${{ matrix.artifact_glob }}
          if-no-files-found: error
          retention-days: 1

      - name: Upload installer artifact (linux)
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v7
        with:
          name: installer-linux
          path: |
            dist-electron/*.deb
            dist-electron/*.AppImage
          if-no-files-found: error
          retention-days: 1

  # ──────────────────────────────────────────────────────────────────────────
  # RELEASE  — runs after ALL THREE builds succeed
  # Downloads every installer and publishes them in one GitHub Release.
  # A single release job avoids race conditions from parallel uploads.
  # ──────────────────────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    name: Publish Release

    steps:
      - name: Checkout (needed to push the 'latest' git tag)
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download macOS arm64 installer
        uses: actions/download-artifact@v8
        with:
          name: installer-mac-arm64
          path: release-files/

      - name: Download Linux installers
        uses: actions/download-artifact@v8
        with:
          name: installer-linux
          path: release-files/

      - name: Download Windows installer
        uses: actions/download-artifact@v8
        with:
          name: installer-windows
          path: release-files/

      - name: List all release files
        run: ls -lh release-files/

      # Compute tag name, title, prerelease flag, and release body
      - name: Set release metadata
        id: meta
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME"                         >> $GITHUB_OUTPUT
            echo "name=SentinelNMS $GITHUB_REF_NAME"            >> $GITHUB_OUTPUT
            echo "prerelease=false"                             >> $GITHUB_OUTPUT
            echo "body=See commit history for full changelog."  >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
            # Use git log — safe even when commit messages are multi-line
            COMMIT_MSG=$(git log -1 --format='%s')
            echo "tag=latest"           >> $GITHUB_OUTPUT
            echo "name=Latest Build"    >> $GITHUB_OUTPUT
            echo "prerelease=true"      >> $GITHUB_OUTPUT
            # Multi-line body format required when value may contain newlines
            {
              echo "body<<EOF"
              echo "Auto-built from \`$SHORT_SHA\` — $COMMIT_MSG"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      # For master push: force-move the 'latest' tag to the current commit
      - name: Force-update 'latest' git tag
        if: github.ref == 'refs/heads/master'
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -fa latest -m "Latest build ($GITHUB_SHA)"
          git push origin latest --force

      # Delete the stale 'latest' release before recreating it with fresh files
      - name: Delete existing 'latest' release
        if: github.ref == 'refs/heads/master'
        run: gh release delete latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        run: |
          PRERELEASE_FLAG=""
          [[ "${{ steps.meta.outputs.prerelease }}" == "true" ]] && PRERELEASE_FLAG="--prerelease"

          NOTES_FLAG=""
          [[ "$GITHUB_REF" == refs/tags/v* ]] && NOTES_FLAG="--generate-notes"

          gh release create "${{ steps.meta.outputs.tag }}" \
            release-files/* \
            --title "${{ steps.meta.outputs.name }}" \
            --notes "${{ steps.meta.outputs.body }}" \
            $PRERELEASE_FLAG \
            $NOTES_FLAG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
