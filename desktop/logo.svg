<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#163150"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </radialGradient>
    <radialGradient id="shieldGrad" cx="50%" cy="20%" r="80%">
      <stop offset="0%" stop-color="#122847"/>
      <stop offset="100%" stop-color="#07121e"/>
    </radialGradient>
    <filter id="tealGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shieldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="50" cy="50" r="49" fill="url(#bgGrad)"/>

  <!-- Shield ambient glow -->
  <path d="M 18 13 L 82 13 L 82 58 L 50 88 L 18 58 Z"
        fill="none" stroke="#14b8a6" stroke-width="10" opacity="0.12"
        filter="url(#shieldGlow)"/>

  <!-- Shield body -->
  <path d="M 18 13 L 82 13 L 82 58 L 50 88 L 18 58 Z"
        fill="url(#shieldGrad)"/>

  <!-- Shield inner bevel (subtle) -->
  <path d="M 21 16 L 79 16 L 79 57 L 50 84 L 21 57 Z"
        fill="none" stroke="#1a3a5c" stroke-width="1"/>

  <!-- Shield border -->
  <path d="M 18 13 L 82 13 L 82 58 L 50 88 L 18 58 Z"
        fill="none" stroke="#14b8a6" stroke-width="2.8" stroke-linejoin="round"/>

  <!-- Top highlight line -->
  <line x1="20" y1="14.5" x2="80" y2="14.5"
        stroke="#2dd4bf" stroke-width="1.4" opacity="0.75"/>

  <!-- Corner accent dots -->
  <circle cx="18" cy="13" r="2" fill="#14b8a6" opacity="0.6"/>
  <circle cx="82" cy="13" r="2" fill="#14b8a6" opacity="0.6"/>

  <!-- Signal arcs — wifi style, opening upward, centered at (50,65) -->
  <!-- Large arc (outermost, faintest) -->
  <path d="M 28 65 A 22 22 0 0 0 72 65"
        fill="none" stroke="#14b8a6" stroke-width="2.2" stroke-linecap="round"
        opacity="0.40" filter="url(#tealGlow)"/>

  <!-- Medium arc -->
  <path d="M 35 65 A 15 15 0 0 0 65 65"
        fill="none" stroke="#14b8a6" stroke-width="2.8" stroke-linecap="round"
        opacity="0.70" filter="url(#tealGlow)"/>

  <!-- Small arc (innermost, full opacity) -->
  <path d="M 42 65 A 8 8 0 0 0 58 65"
        fill="none" stroke="#14b8a6" stroke-width="3.4" stroke-linecap="round"
        filter="url(#tealGlow)"/>

  <!-- Center dot glow ring -->
  <circle cx="50" cy="65" r="7" fill="#14b8a6" opacity="0.18" filter="url(#tealGlow)"/>

  <!-- Center dot -->
  <circle cx="50" cy="65" r="4.5" fill="#14b8a6" filter="url(#tealGlow)"/>
  <circle cx="50" cy="65" r="2.2" fill="#2dd4bf"/>
</svg>
